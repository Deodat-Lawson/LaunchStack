# services/* is deliberately excluded. Those are standalone containers with
# their own deps (including @huggingface/transformers); pulling them into this
# workspace would add them to every app install. Trade-off: they are not
# covered by `pnpm -r typecheck`. See REPOSITORY.md.
#
# pipelines/ is the compositions tier — one package, out of packages/ by
# design: bricks and compositions are different kinds of things.
packages:
  - apps/*
  - packages/*
  - pipelines

patchedDependencies:
  drizzle-kit@0.31.10: patches/drizzle-kit@0.31.10.patch
  # Backports facebook/react#35494 and #35518 into the React that Next 15.5
  # vendors: when hydration suspends on a client chunk and replays an element,
  # React skipped a DOM node and lost its useId path (the intermittent
  # hydration mismatch on /employer/settings). React 19.3 ships both; drop
  # this once Next vendors them. Guarded by
  # apps/web/__tests__/hydration/replay-hydration-cursor.test.ts.
  # Also awaits the request-body hand-off after Node.js middleware
  # (next-server.js `await requestData.body.finalize()`, as Next 16 does):
  # without it a route handler can read an upload that is still streaming,
  # and file uploads fail with "Failed to parse body as FormData". Guarded by
  # apps/web/__tests__/middleware/request-body-after-middleware.test.ts.
  next@15.5.7: patches/next@15.5.7.patch

# eslint-plugin-drizzle 0.2.3 imports this package at runtime but only declares
# it as a devDependency. Supply it explicitly so strict pnpm installs can load
# the shared root ESLint config.
packageExtensions:
  eslint-plugin-drizzle@0.2.3:
    dependencies:
      "@typescript-eslint/utils": ^6.10.0
