name: launchstack-vantage-tl

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: launchstack-vantage-tl-db
    labels:
      io.launchstack.tl-test: contract-v1
    environment:
      POSTGRES_DB: vantage_tl_contract_v1
      POSTGRES_USER: vantage_tl
      POSTGRES_PASSWORD: ${VANTAGE_TL_TEST_PASSWORD:?Use pnpm test:tl to initialize local credentials}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - tl-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantage_tl -d vantage_tl_contract_v1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tl-data:
    name: launchstack-vantage-tl-data
    labels:
      io.launchstack.tl-test: contract-v1
