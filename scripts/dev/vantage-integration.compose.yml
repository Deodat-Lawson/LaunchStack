name: vantage-week2-rebuild-20261022

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vantage-week2-rebuild-20261022-db
    labels:
      io.launchstack.integration-e2e: vantage-week2-rebuild-20261022
    environment:
      POSTGRES_DB: vantage_week2_rebuild_20261022
      POSTGRES_USER: vantage_week2_rebuild
      POSTGRES_PASSWORD: ${VANTAGE_INTEGRATION_PASSWORD:?Use the integration runtime controller}
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - integration-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantage_week2_rebuild -d vantage_week2_rebuild_20261022"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  integration-data:
    name: vantage-week2-rebuild-20261022-data
    labels:
      io.launchstack.integration-e2e: vantage-week2-rebuild-20261022
