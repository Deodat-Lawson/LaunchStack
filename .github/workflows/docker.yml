name: Docker

on:
  pull_request:
    branches: [main]
    paths:
      - apps/web/Dockerfile
      - apps/web/Dockerfile.prebuilt
      - apps/web/Dockerfile.prebuilt.dockerignore
      - .dockerignore
      - docker-compose*.yml
      - apps/web/**
      - apps/worker/**
      - packages/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .pnpmfile.cjs
      - tsconfig.base.json
      - .github/workflows/docker.yml
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-web
  NODE_VERSION: "20"
  PNPM_VERSION: "10.15.1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build migration target (smoke only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: migrate
          push: false
          cache-from: type=gha,scope=source

      - name: Build ${{ github.event_name == 'push' && 'and push' || '(smoke only)' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=source
          cache-to: type=gha,scope=source,mode=max

      # The worker is a required deployment component (ADR-003): a stack
      # without it accepts uploads but never processes them.
      - name: Derive worker tags
        id: worker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build worker ${{ github.event_name == 'push' && 'and push' || '(smoke only)' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  prebuilt:
    name: Build prebuilt runner
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone web app
        env:
          SKIP_ENV_VALIDATION: "1"
          STANDALONE_BUILD: "1"
        run: pnpm --filter @launchstack/web build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build prebuilt migration target (smoke only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prebuilt
          target: migrate
          push: false
          cache-from: type=gha,scope=prebuilt

      - name: Build prebuilt image (smoke only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prebuilt
          target: runner
          push: false
          tags: launchstack-prebuilt:${{ github.sha }}
          cache-from: type=gha,scope=prebuilt
          cache-to: type=gha,scope=prebuilt,mode=max
