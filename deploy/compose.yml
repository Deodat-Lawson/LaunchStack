# LaunchStack, self-hosted: the whole stack from published images.
#
# This is the file `launchstack` (deploy/launchstack) drives, installed as
# ~/.launchstack/compose.yml next to the `docker/` directory it mounts and
# the `.env` that `launchstack setup` writes. Nothing here builds: a machine
# with Docker (Compose 2.24 or newer) is all it needs.
#
# Paths are relative to this file's directory in the installed layout
# (scripts/ops/build-self-host-bundle.sh copies the repository's docker/
# files next to it). To run it from a checkout instead, point Compose at the
# repository root so the same `./docker/...` paths resolve there:
#
#   docker compose --project-directory . -f deploy/compose.yml --env-file .env up -d
#
# ── Two ways to reach it, chosen by DOMAIN in .env ───────────────────────
#
#   Local mode  (DOMAIN empty). Plain HTTP, no Caddy.
#     app            http://localhost:${LAUNCHSTACK_HTTP_PORT:-3000}
#     stored files   http://files.localhost:${LAUNCHSTACK_FILES_PORT:-8333}
#     Both are published on ${LAUNCHSTACK_BIND:-127.0.0.1}; set it to 0.0.0.0
#     to serve a LAN, and then also set LAUNCHSTACK_FILES_URL to the address
#     other machines use (http://<this-host>:<files-port>).
#
#   Domain mode (DOMAIN set, and `domain` in COMPOSE_PROFILES). Caddy takes
#     80/443 and gets certificates for ${DOMAIN} (the app) and files.${DOMAIN}
#     (stored files); both names must resolve to this machine. The switch is
#     the Compose profile `domain`, which is the only thing that starts Caddy,
#     plus DOMAIN itself, which moves the stored-file origin to
#     https://files.${DOMAIN}. COMPOSE_PROFILES is read from .env by Compose,
#     so no --profile flag is needed. Compose cannot drop a port mapping by
#     profile, so the app and file ports above stay published in this mode
#     too: leave LAUNCHSTACK_BIND at 127.0.0.1 and they are reachable only
#     from the machine itself (handy for `launchstack doctor`), never publicly.
#
# ── Where stored files live, and why the address matters ─────────────────
#
# The app stores each file's full URL and later recognises its own files by
# that URL's prefix (apps/web/src/lib/storage.ts), so there is exactly one
# origin, and the browser, the app, the worker and the document services all
# have to be able to open it:
#
#   - Domain mode: https://files.${DOMAIN}. Inside the Compose network that
#     name is an alias of the Caddy container, so containers reach it without
#     leaving the machine (no dependency on hairpin NAT) and still get the
#     real certificate.
#   - Local mode: http://files.localhost:<port>. Browsers and the operating
#     system resolve any *.localhost name to this machine, where the port is
#     published; inside the Compose network the same name is an alias of the
#     seaweedfs container, which listens on the same port number. Plain
#     http://localhost:<port> could not work: inside a container, localhost
#     is the container.
#
# The document converter and the DOCX editor only fetch from an allowlist of
# origins (SSRF guard), which is derived from the same address below.
#
# ── Optional services (add the profile to COMPOSE_PROFILES) ──────────────
#
#   ocr      docling-serve, the local parser for PDFs and Office files
#            (large image, ~800MB RAM). Also set
#            DOCLING_SERVE_URL=http://docling-serve:5001.
#   whisper  on-machine transcription. Also set TRANSCRIPTION_PROVIDER=sidecar.
#   search   SearXNG, a keyless web search engine. Also set
#            SEARCH_PROVIDER=searxng and SEARXNG_URL=http://searxng:8080.
#
# ── Secrets ──────────────────────────────────────────────────────────────
#
# There are no fallback values. Every secret is `${VAR:?…}`: with one missing,
# Compose stops before starting anything and names it. `launchstack setup`
# generates them all. POSTGRES_PASSWORD is placed inside connection URLs, so
# it must be URL-safe (hex, as `openssl rand -hex 32` gives).
#
# ── Images ───────────────────────────────────────────────────────────────
#
# LaunchStack's own images follow LAUNCHSTACK_VERSION (a release such as
# 2.0.0, or `latest`, the newest commit on main). Third-party images are
# pinned to exact versions, so an upgrade is a deliberate edit of this file.

# Not plain `launchstack`: a checkout of the repository in a directory named
# LaunchStack gets that project name by default, and two stacks sharing a
# project name share volumes and remove each other's containers as orphans.
name: launchstack-selfhost

# Bounded container logs. Docker's default json-file driver never rotates,
# and on a single small VM the first thing an unattended stack fills is the
# disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Environment shared by the app (command acceptance + reads) and the worker
# (durable execution). One authority so the two processes can never disagree
# about providers, storage, or service endpoints. Same optional-variable
# allowlist as the repository's docker-compose.yml: anything the operator adds
# with `launchstack config edit` reaches the containers only if it is named
# here.
x-shared-env: &shared-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run 'launchstack setup' to generate it}@db:5432/pdr_ai_v2
  # Anyone running this Compose stack is self-hosting. Declared on the shared
  # anchor so the app and the worker cannot disagree about metering — they
  # boot through the same composition root and would misbehave in different
  # ways if they did.
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self-hosted}
  # Chat: one OpenAI-compatible endpoint. Model ids and route assignments
  # live in the apps/web/config/*.yaml files baked into the app and worker
  # images, not in environment variables. CHAT_MODELS_CONFIG must be
  # relative to apps/web (e.g. config/chat-models.azure.yaml): the worker
  # re-roots it below.
  CHAT_BASE_URL: ${CHAT_BASE_URL:-}
  CHAT_API_KEY: ${CHAT_API_KEY:-}
  CHAT_MODELS_CONFIG: ${CHAT_MODELS_CONFIG:-config/chat-models.yaml}
  # Non-chat providers — global + per-capability. Never used for chat.
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Base URL and key are read as a PAIR at every level, so forwarding a model
  # or a lone key is not enough — without its base URL a capability falls
  # through to "API key not configured" at call time.
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  RERANK_MODEL: ${RERANK_MODEL:-}
  RERANK_API_BASE_URL: ${RERANK_API_BASE_URL:-}
  RERANK_API_KEY: ${RERANK_API_KEY:-}
  NER_MODEL: ${NER_MODEL:-}
  NER_API_BASE_URL: ${NER_API_BASE_URL:-}
  NER_API_KEY: ${NER_API_KEY:-}
  # Stage F entity extraction is opt-in (ADR-011); the facts leg is on unless "false".
  ENABLE_ENTITY_EXTRACTION: ${ENABLE_ENTITY_EXTRACTION:-}
  ENABLE_COMPANY_FACTS_RETRIEVER: ${ENABLE_COMPANY_FACTS_RETRIEVER:-}
  TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-}
  TRANSCRIPTION_API_BASE_URL: ${TRANSCRIPTION_API_BASE_URL:-}
  TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
  # Minutes of audio per transcription call (default 10): longer means fewer
  # calls (a free-tier Gemini key gets 20 a day) but rougher timestamps.
  TRANSCRIPTION_CHUNK_MINUTES: ${TRANSCRIPTION_CHUNK_MINUTES:-}
  # cloud (default) | sidecar. Set sidecar together with the `whisper`
  # profile to transcribe on this machine.
  # Never passed empty: the app validates it as an enum and refuses to boot.
  TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-cloud}
  # Auth (the worker inherits these transitively through the shared
  # composition root — see ADR-002 consequences). BETTER_AUTH_URL is also the
  # public origin every link and OAuth redirect URI is built on.
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is not set - run 'launchstack setup' to generate it}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is not set - run 'launchstack setup' (the address people open, e.g. https://app.example.com or http://localhost:3000)}
  # Same origin, under the name lib/instance-host reads at runtime.
  NEXT_PUBLIC_APP_URL: ${BETTER_AUTH_URL:-}
  # Services
  UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN:-}
  NEXT_PUBLIC_UPLOADTHING_ENABLED: ${NEXT_PUBLIC_UPLOADTHING_ENABLED:-}
  INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?INNGEST_EVENT_KEY is not set - run 'launchstack setup' to generate it}
  # Self-hosted Inngest, signed. An empty INNGEST_DEV is an explicit "not
  # dev" to the SDK (same as "0"): events are sent with INNGEST_EVENT_KEY
  # and every call is signed with INNGEST_SIGNING_KEY. With the event key
  # but no signing key, events are accepted and nothing ever runs.
  INNGEST_DEV: ""
  INNGEST_BASE_URL: http://inngest:8288
  INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?INNGEST_SIGNING_KEY is not set - run 'launchstack setup' to generate it}
  MARKETING_EXECUTOR: ${MARKETING_EXECUTOR:-}
  PROSPECTS_EXECUTOR: ${PROSPECTS_EXECUTOR:-}
  DATALAB_API_KEY: ${DATALAB_API_KEY:-}
  AZURE_DOC_INTELLIGENCE_ENDPOINT: ${AZURE_DOC_INTELLIGENCE_ENDPOINT:-}
  AZURE_DOC_INTELLIGENCE_KEY: ${AZURE_DOC_INTELLIGENCE_KEY:-}
  AZURE_DOC_INTELLIGENCE_MODEL: ${AZURE_DOC_INTELLIGENCE_MODEL:-}
  LANDING_AI_API_KEY: ${LANDING_AI_API_KEY:-}
  GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
  GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-}
  GOOGLE_MODEL: ${GOOGLE_MODEL:-}
  # Image generation. Unset is the normal case: the tool falls back to the
  # CHAT_* pair above, and on an OpenRouter-style endpoint the chat credential
  # already serves images. These exist for a deployment that wants images to
  # come from somewhere other than chat — and they are listed here because this
  # block is an explicit allowlist, so an unlisted variable is invisible to the
  # container no matter what the host .env says.
  IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-}
  IMAGE_API_KEY: ${IMAGE_API_KEY:-}
  IMAGE_MODEL: ${IMAGE_MODEL:-}
  # Forces a wire shape (openrouter | openai-compatible | gemini-native)
  # for a gateway whose hostname does not imply one. Normally inferred.
  IMAGE_API_SHAPE: ${IMAGE_API_SHAPE:-}
  EMBEDDING_INDEX: ${EMBEDDING_INDEX:-legacy-openai-1536}
  EMBEDDING_SECRETS_KEY: ${EMBEDDING_SECRETS_KEY:?EMBEDDING_SECRETS_KEY is not set - run 'launchstack setup' to generate it}
  # Ollama (optional — set OLLAMA_BASE_URL to an Ollama instance)
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-}
  OLLAMA_EMBEDDING_DIMENSION: ${OLLAMA_EMBEDDING_DIMENSION:-}
  OLLAMA_EMBEDDING_VERSION: ${OLLAMA_EMBEDDING_VERSION:-v1}
  HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
  HUGGINGFACE_EMBEDDING_MODEL: ${HUGGINGFACE_EMBEDDING_MODEL:-}
  HUGGINGFACE_EMBEDDING_DIMENSION: ${HUGGINGFACE_EMBEDDING_DIMENSION:-}
  HUGGINGFACE_EMBEDDING_VERSION: ${HUGGINGFACE_EMBEDDING_VERSION:-v1}
  BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
  TOKEN_SIGNUP_BONUS: ${TOKEN_SIGNUP_BONUS:-10000000}
  AI_MONTHLY_TOKEN_LIMIT_PER_USER: ${AI_MONTHLY_TOKEN_LIMIT_PER_USER:-}
  AI_TOKEN_LIMIT_EXEMPT_EMAILS: ${AI_TOKEN_LIMIT_EXEMPT_EMAILS:-}
  AI_USAGE_CHAT_PRICE_PER_MTOK: ${AI_USAGE_CHAT_PRICE_PER_MTOK:-}
  AI_USAGE_EMBEDDING_PRICE_PER_MTOK: ${AI_USAGE_EMBEDDING_PRICE_PER_MTOK:-}
  AI_USAGE_WEB_SEARCH_PRICE_PER_1K: ${AI_USAGE_WEB_SEARCH_PRICE_PER_1K:-}
  AI_USAGE_PRICES: ${AI_USAGE_PRICES:-}
  NEXT_PUBLIC_STORAGE_PROVIDER: s3
  # The one public origin of stored files. Object URLs are persisted with
  # this prefix and lib/storage only recognises a stored URL that starts
  # with it, so the browser, the app, the worker and the document services
  # must all be able to open the same address (see the header).
  #   domain mode: https://files.${DOMAIN}, through Caddy
  #   local mode:  http://files.localhost:<LAUNCHSTACK_FILES_PORT>
  # LAUNCHSTACK_FILES_URL overrides both (local mode on a LAN address).
  NEXT_PUBLIC_S3_ENDPOINT: "${LAUNCHSTACK_FILES_URL:-${DOMAIN:+https://files.}${DOMAIN:-http://files.localhost:${LAUNCHSTACK_FILES_PORT:-8333}}}"
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is not set - run 'launchstack setup' to generate it}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is not set - run 'launchstack setup' to generate it}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-launchstack}
  # Compute services (ADR-004). Every service authenticates with a
  # fail-closed X-API-Key: the key here must match the one the service
  # itself is started with, or every call returns 401.
  TRANSCRIPTION_SERVICE_URL: http://transcription:8000
  TRANSCRIPTION_SERVICE_API_KEY: ${TRANSCRIPTION_SERVICE_API_KEY:?TRANSCRIPTION_SERVICE_API_KEY is not set - run 'launchstack setup' to generate it}
  ADEU_SERVICE_URL: http://adeu-docs-editing:8000
  ADEU_SERVICE_API_KEY: ${ADEU_SERVICE_API_KEY:?ADEU_SERVICE_API_KEY is not set - run 'launchstack setup' to generate it}
  DOCUMENT_CONVERTER_URL: http://document-converter:8002
  DOCUMENT_CONVERTER_API_KEY: ${DOCUMENT_CONVERTER_API_KEY:?DOCUMENT_CONVERTER_API_KEY is not set - run 'launchstack setup' to generate it}
  # OCR order: Azure (when its key is set) → Docling (only while docling-serve
  # answers; the `ocr` profile) → Landing AI → Datalab → the PDF's text layer.
  # Empty = that automatic order; set a provider to try it first.
  OCR_DEFAULT_PROVIDER: ${OCR_DEFAULT_PROVIDER:-}
  # provider-first (unset: every PDF to the first engine above) |
  # text-layer-first (only scans go to OCR) — see .env.example.
  OCR_PDF_STRATEGY: ${OCR_PDF_STRATEGY:-}
  # Gotenberg PDF rendering (ADR-009). Basic auth instead of X-API-Key —
  # that is the auth Gotenberg ships — and fail-closed like the others.
  GOTENBERG_SERVICE_URL: http://gotenberg:3000
  GOTENBERG_SERVICE_USERNAME: launchstack
  GOTENBERG_SERVICE_PASSWORD: ${GOTENBERG_SERVICE_PASSWORD:?GOTENBERG_SERVICE_PASSWORD is not set - run 'launchstack setup' to generate it}
  # Lets the document converter (and the app's own server-side fetches) read
  # database-backed /api/files URLs, which otherwise require a session
  # they do not have. Signed by whichever process mints the URL, so app and
  # worker must share the same value. Database-backed ingestion fails closed
  # without it.
  FILE_ACCESS_TOKEN_SECRET: ${FILE_ACCESS_TOKEN_SECRET:?FILE_ACCESS_TOKEN_SECRET is not set - run 'launchstack setup' to generate it}
  # Bearer token for /api/metrics. This environment block is an explicit
  # allowlist, so without the passthrough the route fails closed at 503
  # even when the host .env sets it.
  METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
  # Serves the auth-free /dev/* preview pages from a production build. Off
  # unless set — the published image must never answer these — but a local
  # stack can turn them on to look at UI without a session.
  ENABLE_DEV_ROUTES: ${ENABLE_DEV_ROUTES:-}
  # Integrations. This block is an explicit allowlist, so a key set in the host
  # .env (or synced from Key Vault) is invisible to the container unless it is
  # listed here. Every one is optional and unset by default; a feature stays
  # off until its credentials are present. Deliberately NOT listed because an
  # empty string is not "unset" for it: GOOGLE_DOCS_SETTLE_MINUTES (Number("")
  # is 0, not the default).
  # Sign in with Google / GitHub / Microsoft / your own OIDC identity provider
  # (better-auth callbacks under /api/auth).
  AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
  AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
  AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
  AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}
  AUTH_MICROSOFT_CLIENT_ID: ${AUTH_MICROSOFT_CLIENT_ID:-}
  AUTH_MICROSOFT_CLIENT_SECRET: ${AUTH_MICROSOFT_CLIENT_SECRET:-}
  AUTH_MICROSOFT_TENANT_ID: ${AUTH_MICROSOFT_TENANT_ID:-}
  AUTH_MICROSOFT_AUTHORITY: ${AUTH_MICROSOFT_AUTHORITY:-}
  AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
  AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
  AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
  AUTH_OIDC_NAME: ${AUTH_OIDC_NAME:-}
  # Workspace connectors: Google Drive + Gmail, GitHub, Slack, Notion.
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
  GOOGLE_DOCS_EDITING_ENABLED: ${GOOGLE_DOCS_EDITING_ENABLED:-}
  GMAIL_CONNECTOR_ENABLED: ${GMAIL_CONNECTOR_ENABLED:-}
  GOOGLE_DRIVE_FOLDER_ACCESS_ENABLED: ${GOOGLE_DRIVE_FOLDER_ACCESS_ENABLED:-}
  # Google Picker (Drive connector). Public by design; the app serves them to the
  # browser from its status route at request time, so they need no build arg.
  NEXT_PUBLIC_GOOGLE_API_KEY: ${NEXT_PUBLIC_GOOGLE_API_KEY:-}
  NEXT_PUBLIC_GOOGLE_APP_ID: ${NEXT_PUBLIC_GOOGLE_APP_ID:-}
  GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
  GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  NOTION_OAUTH_CLIENT_ID: ${NOTION_OAUTH_CLIENT_ID:-}
  NOTION_OAUTH_CLIENT_SECRET: ${NOTION_OAUTH_CLIENT_SECRET:-}
  # Growth › Brand social accounts. LinkedIn: the app pair and the exact
  # scopes its Auth tab lists. The deployment-wide keys below are the
  # fallback for networks a workspace has not connected itself.
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  LINKEDIN_OAUTH_SCOPES: ${LINKEDIN_OAUTH_SCOPES:-}
  LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-}
  LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
  TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
  BLUESKY_HANDLE: ${BLUESKY_HANDLE:-}
  BLUESKY_APP_PASSWORD: ${BLUESKY_APP_PASSWORD:-}
  BRAND_DEPLOYMENT_ACCOUNTS_COMPANY_ID: ${BRAND_DEPLOYMENT_ACCOUNTS_COMPANY_ID:-}
  REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
  REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
  REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-}
  # Where the converter, editor and worker reach this app to fetch /api/files.
  # Never used for a URL a person or OAuth provider opens (BETTER_AUTH_URL is).
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
  # Public site (apps/landing) origin, read per request by /site, /privacy and
  # /terms. Unset falls back to the origin baked in at build time.
  LANDING_PUBLIC_URL: ${LANDING_PUBLIC_URL:-}
  # Campaign email: HMAC key for unsubscribe links, and the send switch
  # (anything but "true" is a dry run).
  EMAIL_UNSUBSCRIBE_SECRET: ${EMAIL_UNSUBSCRIBE_SECRET:-}
  EMAIL_SENDING_ENABLED: ${EMAIL_SENDING_ENABLED:-}
  # Investor relations: the SEC rejects requests without "name email".
  SEC_EDGAR_USER_AGENT: ${SEC_EDGAR_USER_AGENT:-}
  # In-app feedback: who triages (unset keeps it off) and the optional
  # Slack/Discord webhook told about each new report.
  FEEDBACK_ADMIN_EMAILS: ${FEEDBACK_ADMIN_EMAILS:-}
  FEEDBACK_WEBHOOK_URL: ${FEEDBACK_WEBHOOK_URL:-}
  # Web search: one engine for every feature. SEARCH_PROVIDER picks it
  # (exa | serper | brave | tavily | searxng); empty means the first engine
  # below with a credential, in that order. A named engine without its
  # credential turns web search off rather than switching engines. Only Exa
  # has a company index (Prospects company search + lookalikes).
  SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
  EXA_API_KEY: ${EXA_API_KEY:-}
  SERPER_API_KEY: ${SERPER_API_KEY:-}
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  # Base URL of a SearXNG instance with JSON output on — the bundled one is
  # http://searxng:8080 (the `search` profile). Empty by default: the URL
  # counts as a credential, so set it only when an instance is running.
  SEARXNG_URL: ${SEARXNG_URL:-}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run 'launchstack setup' to generate it}
      POSTGRES_DB: pdr_ai_v2
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on a fresh data volume: pgvector, plus the database and
      # table SeaweedFS keeps its file index in.
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    # No published port. `launchstack backup` and psql go through
    # `docker compose exec db`.
    networks: [default, inngest]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdr_ai_v2"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # Applies the ordered SQL migrations, then exits; app and worker wait for it.
  # The same image carries the preflight script, which the CLI runs as
  #   docker compose run --rm --no-deps -T migrate node scripts/deploy-check.mjs [--probe]
  # `env_file` hands that script the install's .env exactly as written (the
  # blocks below only pass an allowlist), and the shared environment adds the
  # in-network addresses it probes. `required: false` so the file can still
  # be parsed before setup has written a .env.
  migrate:
    image: ${LAUNCHSTACK_IMAGE_PREFIX:-ghcr.io/deodat-lawson/launchstack}-web-migrate:${LAUNCHSTACK_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      <<: *shared-env
      SKIP_ENV_VALIDATION: "1"
    # Both networks, so `--probe` can reach Inngest as well as the services.
    networks: [default, inngest]
    restart: "no"
    logging: *logging

  # Object storage (S3 API). Anonymous read, signed write: only the app and
  # worker hold the credentials. Object keys contain UUIDs.
  seaweedfs:
    image: chrislusf/seaweedfs:4.44
    # Run through sh so the mounted script works even if an unpacking step
    # dropped its executable bit.
    entrypoint: ["/bin/sh", "/etc/seaweedfs/entrypoint.sh"]
    # The other long-running services restart on their own; without this a
    # single failed start (a slow db, a host reboot) leaves object storage down
    # until someone notices.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The filer stores its metadata in Postgres, and docker/filer.toml is a
      # static file mounted read-only — its `password` line can only carry a
      # placeholder. SeaweedFS overlays any filer.toml key from
      # WEED_<SECTION>_<KEY>, so this is what actually authenticates the filer.
      # Without it the filer crash-loops on `failed SASL auth` and object
      # storage never comes up.
      WEED_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run 'launchstack setup' to generate it}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is not set - run 'launchstack setup' to generate it}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is not set - run 'launchstack setup' to generate it}
      # The S3 port inside the container equals the published one, so that
      # http://files.localhost:<port> means the same thing to a browser on
      # this machine and to a container (see the header).
      S3_PORT: ${LAUNCHSTACK_FILES_PORT:-8333}
    volumes:
      - seaweedfs_data:/data
      - ./docker/filer.toml:/etc/seaweedfs/filer.toml:ro
      - ./docker/seaweedfs-entrypoint.sh:/etc/seaweedfs/entrypoint.sh:ro
    ports:
      - "${LAUNCHSTACK_BIND:-127.0.0.1}:${LAUNCHSTACK_FILES_PORT:-8333}:${LAUNCHSTACK_FILES_PORT:-8333}"
    networks:
      default:
        aliases:
          # Local mode's stored-file hostname, as containers see it.
          - files.localhost
    healthcheck:
      # Master is up and the S3 gateway is accepting connections.
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 $${S3_PORT}",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # Authoritative Adeu DOCX redlining service (ADR-004, renamed per ADR-007).
  # Owns the whole edit workflow, not one library call per route. Auth fails
  # closed: the key must match the app/worker copy or every call returns 401.
  adeu-docs-editing:
    image: ${LAUNCHSTACK_IMAGE_PREFIX:-ghcr.io/deodat-lawson/launchstack}-adeu-docs-editing:${LAUNCHSTACK_VERSION:-latest}
    restart: unless-stopped
    environment:
      ADEU_SERVICE_API_KEY: ${ADEU_SERVICE_API_KEY:?ADEU_SERVICE_API_KEY is not set - run 'launchstack setup' to generate it}
      # Only object references from these origins may be fetched (SSRF guard,
      # ADR-004 §6) — same rule the converter enforces. The last entry is the
      # stored-file origin the app hands out (NEXT_PUBLIC_S3_ENDPOINT above);
      # without it the service refuses every file passed by reference.
      ALLOWED_FETCH_ORIGINS: "${ADEU_ALLOWED_FETCH_ORIGINS:-http://app:3000,http://seaweedfs:${LAUNCHSTACK_FILES_PORT:-8333},${LAUNCHSTACK_FILES_URL:-${DOMAIN:+https://files.}${DOMAIN:-http://files.localhost:${LAUNCHSTACK_FILES_PORT:-8333}}}}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # Document converter (ADR-004): routing decisions, vision classification,
  # PDF page rendering, and docling-backed parsing with typed
  # EvidenceDocument output. Reads its own credentials at startup — the app
  # never forwards secrets.
  document-converter:
    image: ${LAUNCHSTACK_IMAGE_PREFIX:-ghcr.io/deodat-lawson/launchstack}-document-converter:${LAUNCHSTACK_VERSION:-latest}
    restart: unless-stopped
    environment:
      CONVERTER_API_KEY: ${DOCUMENT_CONVERTER_API_KEY:?DOCUMENT_CONVERTER_API_KEY is not set - run 'launchstack setup' to generate it}
      # Only object references from these origins may be fetched (SSRF guard);
      # the last entry is the stored-file origin, as for the editor above.
      ALLOWED_FETCH_ORIGINS: "${CONVERTER_ALLOWED_FETCH_ORIGINS:-http://app:3000,http://seaweedfs:${LAUNCHSTACK_FILES_PORT:-8333},${LAUNCHSTACK_FILES_URL:-${DOMAIN:+https://files.}${DOMAIN:-http://files.localhost:${LAUNCHSTACK_FILES_PORT:-8333}}}}"
      # Empty means "no Docling": scans go to the OCR provider and the worker
      # converts Office files itself (mammoth/SheetJS). Left pointing at a
      # docling-serve that is not running, every Office file the converter is
      # asked to convert fails against it. With the `ocr` profile, set
      # DOCLING_SERVE_URL=http://docling-serve:5001.
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-}
      OCR_DEFAULT_PROVIDER: ${OCR_DEFAULT_PROVIDER:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      OCR_VISION_MODEL: ${OCR_VISION_MODEL:-}
      AZURE_DOC_INTELLIGENCE_ENDPOINT: ${AZURE_DOC_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOC_INTELLIGENCE_KEY: ${AZURE_DOC_INTELLIGENCE_KEY:-}
      LANDING_AI_API_KEY: ${LANDING_AI_API_KEY:-}
      DATALAB_API_KEY: ${DATALAB_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # Gotenberg PDF rendering (ADR-009): DOCX/Office → PDF via LibreOffice,
  # HTML/Markdown → PDF via Chromium. Auth fails closed
  # (--api-enable-basic-auth + the shared-env pair), and the Chromium
  # deny-list blocks fetches of private-network resources referenced from user
  # HTML — the SSRF guard the other services express as ALLOWED_FETCH_ORIGINS.
  # JavaScript is off: nothing the product renders needs it, and user HTML
  # must not get a scripting engine.
  gotenberg:
    image: gotenberg/gotenberg:8.36.0
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=60s
      - --api-enable-basic-auth
      - --chromium-disable-javascript=true
      - --libreoffice-restart-after=10
      # First alternative is Gotenberg's own default (block file: outside its
      # /tmp working dir) — overriding the flag replaces it, so it is repeated.
      # The service names are this file's: keep the list in step with it.
      - >-
        --chromium-deny-list=^file:(?!//\/tmp/).*|^https?://(?:[^/]*@)?(?:localhost|[^/:@]+\.localhost|127\.[0-9.]+|0\.0\.0\.0|10\.[0-9.]+|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9.]+|192\.168\.[0-9.]+|169\.254\.[0-9.]+|\[::1\]|db|migrate|seaweedfs|app|worker|caddy|transcription|adeu-docs-editing|document-converter|docling-serve|searxng|inngest|inngest-redis|inngest-db-init|gotenberg)(?::[0-9]+)?(?:/.*)?$$
    environment:
      GOTENBERG_API_BASIC_AUTH_USERNAME: launchstack
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ${GOTENBERG_SERVICE_PASSWORD:?GOTENBERG_SERVICE_PASSWORD is not set - run 'launchstack setup' to generate it}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u launchstack:$${GOTENBERG_API_BASIC_AUTH_PASSWORD} http://localhost:3000/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # The sole durable workflow coordinator (ADR-003): outbox consumer +
  # Inngest serve endpoint. The app accepts commands; this executes them. A
  # stack without it accepts uploads but never processes them.
  worker:
    image: ${LAUNCHSTACK_IMAGE_PREFIX:-ghcr.io/deodat-lawson/launchstack}-web-worker:${LAUNCHSTACK_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    environment:
      <<: *shared-env
      # The shared-env value is RELATIVE to apps/web (the app's WORKDIR), but
      # this container starts in /app/apps/worker. Resolve the same file the
      # app reads, or the two processes run different models (ADR-003). The
      # worker image carries apps/web/config, as the app image does.
      CHAT_MODELS_CONFIG: /app/apps/web/${CHAT_MODELS_CONFIG:-config/chat-models.yaml}
      WORKER_PORT: "8020"
      # The serve URL the SDK registers with Inngest. Pinned so a sync
      # triggered from inside the container (localhost) can't register an
      # address the server cannot reach.
      INNGEST_SERVE_HOST: http://worker:8020
    # Not published: nothing outside the machine calls the worker. The
    # Inngest server reaches /api/inngest on the `inngest` network.
    networks: [default, inngest]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8020/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  app:
    image: ${LAUNCHSTACK_IMAGE_PREFIX:-ghcr.io/deodat-lawson/launchstack}-web:${LAUNCHSTACK_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
      # Startup ordering only — the app has typed runtime errors for every
      # unreachable service, so none of them gates the app's own health.
      adeu-docs-editing:
        condition: service_started
      document-converter:
        condition: service_started
      gotenberg:
        condition: service_started
    environment:
      <<: *shared-env
    # Local mode's front door. In domain mode Caddy is the front door and this
    # stays a loopback convenience (see the header).
    ports:
      - "${LAUNCHSTACK_BIND:-127.0.0.1}:${LAUNCHSTACK_HTTP_PORT:-3000}:3000"
    networks: [default, inngest]
    healthcheck:
      # 200 only while the database answers; 503 otherwise.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *logging

  # ── Self-hosted Inngest ────────────────────────────────────────────────
  # Executes the worker's background functions: Drive and Gmail sync and
  # their crons, brand publishing, Prospects/Proposals runs, the founder
  # weekly review, reindex, crawls. Document ingestion does not use it — that
  # runs through the Postgres outbox (ADR-003). Its network (`inngest`) holds
  # only the server, its Redis, and the services it works with (app, worker,
  # db, and the one-shot migrate/preflight), so nothing that fetches
  # user-supplied URLs (gotenberg, the document services) can reach its
  # unauthenticated dashboard API.

  # Creates Inngest's database on the shared Postgres if it is missing, then
  # exits. docker/init-db.sql only runs on a fresh volume, so this is what
  # covers a volume that predates it.
  inngest-db-init:
    image: pgvector/pgvector:0.8.7-pg16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run 'launchstack setup' to generate it}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'inngest'" | grep -q 1
        || psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE inngest"
    restart: "no"
    logging: *logging

  # Queue and in-flight run state. External rather than the server's built-in
  # in-memory Redis, which is only snapshotted periodically: a crash or OOM
  # kill between snapshots would drop queued runs. AOF fsyncs every second.
  # noeviction because an evicted key is a lost step; the cap makes Redis
  # refuse writes before the container limit kills it.
  inngest-redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - inngest_redis_data:/data
    networks: [inngest]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  inngest:
    # Pinned: `inngest start` is the production server and its Postgres schema
    # migrates on boot, so upgrades are deliberate (bump, read the release
    # notes, redeploy). v1.46.0 carries the dashboard CVE fix (TanStack Start).
    image: inngest/inngest:v1.46.0
    restart: unless-stopped
    command:
      - inngest
      - start
      # Syncs the worker's functions at boot and re-checks every 60s. The
      # re-check does not reliably pick up new functions after a worker
      # update, so `launchstack update` also asks the worker to re-register.
      - --sdk-url=http://worker:8020/api/inngest
      - --poll-interval=60
      # The shared Postgres also serves the app (max_connections 100); keep
      # Inngest's pool small. Its default is 100 open connections.
      - --postgres-max-open-conns=10
      - --postgres-max-idle-conns=2
    environment:
      # The server accepts events only with this key and signs every request
      # to the worker with this one. Same values app + worker read. Both are
      # hex (`openssl rand -hex 32`).
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?INNGEST_EVENT_KEY is not set - run 'launchstack setup' to generate it}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?INNGEST_SIGNING_KEY is not set - run 'launchstack setup' to generate it}
      INNGEST_POSTGRES_URI: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run 'launchstack setup' to generate it}@db:5432/inngest?sslmode=disable
      INNGEST_REDIS_URI: redis://inngest-redis:6379
      # Without this the CLI posts usage events to Inngest's cloud event API
      # (`cli/command.executed` at every start, `cli/dev_ui.loaded` on each
      # dashboard load). Nothing about this stack should phone home.
      DO_NOT_TRACK: "1"
    # Dashboard + API, loopback only in both modes: it has no login. On a
    # server, reach it with `ssh -N -L 8288:127.0.0.1:8288 <user>@<host>`.
    ports:
      - "127.0.0.1:${LAUNCHSTACK_INNGEST_PORT:-8288}:8288"
    depends_on:
      inngest-db-init:
        condition: service_completed_successfully
      inngest-redis:
        condition: service_healthy
      # Ordering only: the 60s poll syncs a worker that comes up later, and
      # the app must be able to send events even while the worker restarts.
      worker:
        condition: service_started
    networks: [inngest]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "inngest", "alpha", "doctor", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *logging

  # ── Domain mode ────────────────────────────────────────────────────────
  # Caddy terminates TLS for ${DOMAIN} (the app) and files.${DOMAIN} (stored
  # files, anonymous read) and renews both certificates itself. Started only
  # by the `domain` profile.
  caddy:
    image: caddy:2.11.9-alpine
    profiles: ["domain"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # A single-file bind mount: after `launchstack update` rewrites the
      # Caddyfile the container must be recreated (or restarted), not
      # `caddy reload`ed — a rewrite swaps the inode and the running container
      # keeps reading the old file.
      - ./docker/Caddyfile.selfhost:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account. Losing this volume means re-issuing,
      # and Let's Encrypt rate-limits that.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-}
      # The Caddyfile's whole `tls <email>` line, or nothing: Caddy rejects
      # the directive with an empty argument.
      TLS_DIRECTIVE: "${ACME_EMAIL:+tls }${ACME_EMAIL:-}"
      FILES_UPSTREAM: seaweedfs:${LAUNCHSTACK_FILES_PORT:-8333}
    depends_on:
      - app
    networks:
      default:
        aliases:
          # Containers open the stored-file origin too; this keeps that
          # traffic on the machine (see the header). The fallback only keeps
          # the file valid in local mode, where Caddy never starts.
          - files.${DOMAIN:-domain.invalid}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *logging

  # ── Optional services ──────────────────────────────────────────────────

  # `ocr`: Docling parse engine for PDFs/Office docs (DOCX, PPTX, XLSX,
  # EPUB), and the OCR fallback after Azure. Adds ~800MB RAM and a very large
  # image. Without it the converter's /convert returns a typed 503 and routing
  # leaves Docling out of the OCR order; text-file ingestion keeps working.
  docling-serve:
    image: ghcr.io/docling-project/docling-serve:v1.31.0
    profiles: ["ocr"]
    restart: unless-stopped
    environment:
      DOCLING_SERVE_MAX_NUM_PAGES: "200"
    volumes:
      - docling_models:/opt/app-root/src/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging: *logging

  # `whisper`: Whisper transcription + yt-dlp download (ADR-004), on this
  # machine instead of the cloud transcription provider. Auth fails closed:
  # the key must match the app/worker copy or every call returns 401.
  transcription:
    image: ${LAUNCHSTACK_IMAGE_PREFIX:-ghcr.io/deodat-lawson/launchstack}-transcription:${LAUNCHSTACK_VERSION:-latest}
    profiles: ["whisper"]
    restart: unless-stopped
    environment:
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_SERVICE_API_KEY:?TRANSCRIPTION_SERVICE_API_KEY is not set - run 'launchstack setup' to generate it}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging: *logging

  # `search`: SearXNG, a free self-hosted metasearch engine — the keyless
  # choice for web search. No published port: only the app and worker reach
  # it, over the Compose network, which is why docker/searxng/settings.yml
  # turns its bot limiter off. It queries public engines (Google, Bing,
  # DuckDuckGo, …) from this host's IP, and they may rate-limit or CAPTCHA a
  # busy instance, which then returns fewer results or none.
  searxng:
    image: searxng/searxng:2026.10.25-54ca1d9cf
    profiles: ["search"]
    restart: unless-stopped
    environment:
      # Signs SearXNG's cookies; overrides server.secret_key in the settings
      # file. Required even while the profile is off: Compose resolves every
      # variable in the file, and setup generates it either way.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is not set - run 'launchstack setup' to generate it}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Loading its engine list can take about a minute.
      start_period: 60s
    logging: *logging

volumes:
  postgres_data:
  seaweedfs_data:
  inngest_redis_data:
  caddy_data:
  caddy_config:
  docling_models:

networks:
  # Inngest's network: the server, its Redis, and app/worker/db (see the
  # self-hosted Inngest block above).
  inngest:
