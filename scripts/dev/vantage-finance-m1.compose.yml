name: vantage-finance-m1-20261105

services:
  db:
    image: pgvector/pgvector:pg16
    pull_policy: never
    container_name: vantage-finance-m1-20261105-db
    labels:
      io.launchstack.integration-e2e: vantage-finance-m1-20261105
    environment:
      POSTGRES_DB: vantage_finance_m1_20261105
      POSTGRES_USER: vantage_finance_m1
      POSTGRES_PASSWORD: ${VANTAGE_INTEGRATION_PASSWORD:?Use the integration runtime controller}
    ports:
      - "127.0.0.1:55446:5432"
    volumes:
      - integration-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantage_finance_m1 -d vantage_finance_m1_20261105"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  integration-data:
    name: vantage-finance-m1-20261105-data
    labels:
      io.launchstack.integration-e2e: vantage-finance-m1-20261105
