# Production overlay — the "lean" single-VM deployment (see
# docs/runbooks/azure-lean-deploy.md).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d
#
# What it changes relative to the local stack:
#   - app + worker run the GHCR images published by .github/workflows/docker.yml
#     (only `migrate` still builds locally — its target is the light deps stage).
#   - No self-hosted Whisper and no Docling: transcription resolves to the
#     cloud provider (packages/llm registry default) and OCR routes to the
#     provider named by OCR_DEFAULT_PROVIDER (AZURE in the lean setup). Both
#     containers move behind opt-in profiles.
#   - A self-hosted Inngest server (`inngest`) replaces the dev server. It
#     runs the background verticals (Drive/Gmail sync, crons, prospector, …)
#     against the worker over the compose network; INNGEST_EVENT_KEY and
#     INNGEST_SIGNING_KEY (hex) must be set or nothing it schedules can run.
#     Ingestion itself runs through the outbox and needs neither.
#   - Caddy terminates TLS for ${DOMAIN} (app) and files.${DOMAIN} (SeaweedFS
#     object URLs, anonymous read). The worker's /api/inngest stays internal.
#   - No service publishes a host port except Caddy; the NSG only admits
#     22/80/443 anyway, but the containers shouldn't offer more than the
#     firewall happens to block.

services:
  app:
    image: ghcr.io/deodat-lawson/launchstack-web:latest
    build: !reset null
    ports: !reset []
    depends_on: !reset
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
      adeu-docs-editing:
        condition: service_started
      document-converter:
        condition: service_started
    networks: [default, inngest]
    environment:
      INNGEST_DEV: ""
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      # Events go to the self-hosted server below, not Inngest Cloud.
      INNGEST_BASE_URL: http://inngest:8288
      # Public object-URL origin. Also the SDK endpoint — the app reaches its
      # own SeaweedFS through Caddy so that stored URLs and fetch checks agree
      # on one origin (lib/storage matches URLs by this prefix).
      NEXT_PUBLIC_S3_ENDPOINT: https://files.${DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      # Read per request by /privacy and /terms (server/landing-redirect.ts);
      # the image is built in CI, so a build-time value can't carry DOMAIN.
      LANDING_PUBLIC_URL: https://home.${DOMAIN}

  worker:
    image: ghcr.io/deodat-lawson/launchstack-web-worker:latest
    build: !reset null
    ports: !reset []
    networks: [default, inngest]
    environment:
      INNGEST_DEV: ""
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      INNGEST_BASE_URL: http://inngest:8288
      # The SDK registers the URL a sync request arrived on unless this pins
      # it, and its out-of-band sync (PUT) is unauthenticated.
      INNGEST_SERVE_HOST: http://worker:8020
      NEXT_PUBLIC_S3_ENDPOINT: https://files.${DOMAIN}

  # Self-hosted Inngest: queue, scheduler and cron for every function the
  # worker serves. Without it events are accepted and nothing ever runs
  # (Drive stays at "Not synced yet"). State is SQLite plus the built-in
  # Redis snapshot on the volume. It lives on its own network with only app and
  # worker, so nothing that fetches user-supplied URLs (gotenberg, the
  # document services) can reach its dashboard API, which has no login. Tunnel
  # to it over SSH; never publish it.
  inngest:
    image: inngest/inngest:v1.46.0
    container_name: pdr_ai_v2-inngest-server
    restart: unless-stopped
    command: inngest start
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      # Hex with an even number of characters (openssl rand -hex 32); the
      # worker verifies every call with the same value.
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      INNGEST_SDK_URL: http://worker:8020/api/inngest
      # Re-sync on an interval: the boot-time sync fails whenever the worker
      # is not up yet, and a worker redeploy can add functions.
      INNGEST_POLL_INTERVAL: "60"
      INNGEST_SQLITE_DIR: /data
    volumes:
      - inngest_data:/data
    networks: [inngest]
    depends_on:
      - worker
    healthcheck:
      test: ["CMD", "inngest", "alpha", "doctor", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    ports: !reset []

  # The base stack leaves seaweedfs with Docker's default restart policy, so a
  # single failed start (a slow db, a host reboot) leaves object storage down
  # until someone notices. Every other service here is unless-stopped.
  seaweedfs:
    restart: unless-stopped

  adeu-docs-editing:
    ports: !reset []

  document-converter:
    ports: !reset []

  # Added to the base stack by ADR-009; same rule as the others.
  gotenberg:
    ports: !reset []

  # Self-hosted Whisper — excluded from the lean stack. Re-enable with
  # `--profile whisper` and TRANSCRIPTION_PROVIDER=sidecar.
  transcription:
    profiles: ["whisper"]
    ports: !reset []

  # Dev-only Inngest server; production runs `inngest` (above) instead.
  inngest-dev:
    profiles: ["inngest-dev"]

  # The marketing site — the "home page" a signed-out visitor lands on.
  # apps/web's `/` is the product's front door and redirects to /signin by
  # design; this serves the public site on its own hostname so a self-hosted
  # deployment does not have to send people to launchstack.app.
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      target: runner
      # Build-time, because Next inlines NEXT_PUBLIC_* into the bundle; the
      # `environment` copies below only reach server-side code.
      args:
        NEXT_PUBLIC_SITE_URL: https://home.${DOMAIN}
        NEXT_PUBLIC_APP_URL: https://${DOMAIN}
    container_name: pdr_ai_v2-landing
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: https://home.${DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""

  caddy:
    image: caddy:2
    container_name: pdr_ai_v2-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  inngest_data:

networks:
  # The Inngest server plus the two services that talk to it.
  inngest:
