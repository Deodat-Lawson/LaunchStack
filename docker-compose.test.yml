# Docker Compose override for integration-testing the compute services.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up transcription adeu-docs-editing --build
#
# Then run: ./scripts/dev/test-sidecar-integration.sh

services:
  transcription:
    build:
      context: ./services/transcription
      dockerfile: Dockerfile
    container_name: pdr_ai_v2-transcription-test
    environment:
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_SERVICE_API_KEY:-pdr_local_sidecar_key}
    ports:
      - "8000:8000"
    healthcheck:
      # python:3.12-slim images ship no curl; use the same urllib probe as the
      # main compose file.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5

  adeu-docs-editing:
    build:
      context: ./services/adeu-ai-docs-editing
      dockerfile: Dockerfile
    container_name: pdr_ai_v2-adeu-docs-editing-test
    environment:
      ADEU_SERVICE_API_KEY: ${ADEU_SERVICE_API_KEY:-pdr_local_adeu_key}
    ports:
      - "8003:8000"
    healthcheck:
      # python:3.12-slim images ship no curl; use the same urllib probe as the
      # main compose file.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
