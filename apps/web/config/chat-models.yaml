# Chat model configuration. Mounted read-only into the app and the worker, so
# changing a model is an edit plus a restart — never an image rebuild.
#
# `id` is the id your endpoint serves. CHAT_BASE_URL points at OpenRouter,
# which takes the vendor-prefixed form written here. Google's own endpoint
# (CHAT_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai)
# rejects the prefix: a deployment talking to Google directly mounts a copy of
# this file with bare ids (`gemini-3.8-flash`) via CHAT_MODELS_CONFIG.
#
# Every route runs on Gemini 3.8 Flash, whose behavior is a verified catalog
# entry in packages/llm/src/presets.ts. Google publishes no 3.8 Pro or 3.8
# Flash-Lite, so the tiers differ by reasoning effort rather than by model.
# A model with neither a preset nor a `behavior` block is a startup error by
# design — an unknown model is never silently classified as text-only.
version: 1

models:
    # Vision route inherits this model, so it must declare image input.
    primary:
        id: google/gemini-3.8-flash
        preset: google/gemini-3.8-flash

    # The cheap tier: same model, no thinking unless a caller asks for it.
    fast:
        id: google/gemini-3.8-flash
        preset: google/gemini-3.8-flash
        behavior:
            reasoning:
                mode: effort
                levels:
                    none: { reasoning_effort: "none" }
                    low: { reasoning_effort: "low" }
                default: "none"

    # The reasoning route: same model, thinking hard by default. `none` is
    # absent on purpose — a caller routed here asked for reasoning.
    deep:
        id: google/gemini-3.8-flash
        preset: google/gemini-3.8-flash
        behavior:
            reasoning:
                mode: effort
                levels:
                    low: { reasoning_effort: "low" }
                    medium: { reasoning_effort: "medium" }
                    high: { reasoning_effort: "high" }
                default: "high"

routes:
    default: primary
    fast: fast
    reasoning: deep
    vision: primary
